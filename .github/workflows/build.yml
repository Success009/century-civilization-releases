name: Cloud Build and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.155)'
        required: true
        default: '1.0.155'
      mode:
        description: 'Build Mode (publish, deploy, check)'
        required: true
        default: 'publish'
      compile_linux:
        description: 'Compile Linux JAR'
        type: boolean
        default: true
      compile_windows:
        description: 'Compile Windows JAR'
        type: boolean
        default: true
      compile_mac:
        description: 'Compile macOS JAR'
        type: boolean
        default: true
      build_go_linux:
        description: 'Rebuild Linux Go native bridge'
        type: boolean
        default: false
      build_go_windows:
        description: 'Rebuild Windows Go native bridge'
        type: boolean
        default: false
      build_go_mac:
        description: 'Rebuild macOS Go native bridge'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  cloud-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Cross-Compilers for Go (MinGW)
        if: ${{ inputs.build_go_windows == true || inputs.build_go_windows == 'true' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Native Go Bridges
        run: |
          BIN_DIR="src/main/resources/assets/century/bin"
          mkdir -p "$BIN_DIR"

          if [ "${{ inputs.build_go_linux }}" = "true" ]; then
            echo "Compiling Linux Go Bridge in parallel..."
            (cd native_bridge_source && CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o libbridge-linux-amd64.so main.go && cp libbridge-linux-amd64.so ../"$BIN_DIR"/) &
          fi

          if [ "${{ inputs.build_go_windows }}" = "true" ]; then
            echo "Compiling Windows Go Bridge in parallel..."
            (cd native_bridge_source && CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -buildmode=c-shared -o bridge-windows-amd64.dll main.go && cp bridge-windows-amd64.dll bridge-windows-amd64.h ../"$BIN_DIR"/) &
          fi
          wait

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Mode Check - CompileJava Syntax Verification
        if: ${{ inputs.mode == 'check' }}
        run: |
          ./gradlew compileJava

      - name: Multiplatform Compilation & Packaging
        if: ${{ inputs.mode != 'check' }}
        run: |
          VERSION="${{ inputs.version }}"
          OUTPUT_DIR="compiled_jars"
          BIN_DIR="src/main/resources/assets/century/bin"

          mkdir -p "$OUTPUT_DIR"

          echo "Building Master Combined Universal Mod JAR (${VERSION})..."
          ./gradlew clean build -Pmod_version="${VERSION}"

          MASTER_JAR="build/libs/CenturyCivilization-${VERSION}.jar"
          if [ ! -f "$MASTER_JAR" ]; then
            echo "ERROR: Master JAR output not found at $MASTER_JAR"
            exit 1
          fi

          # 1. Provide Combined Universal Multiplatform JARs
          cp "$MASTER_JAR" "${OUTPUT_DIR}/CenturyCivilization-${VERSION}-universal.jar"
          cp "$MASTER_JAR" "${OUTPUT_DIR}/CenturyCivilization-${VERSION}.jar"
          echo "SUCCESS: Created Combined Universal JARs (Universal & Default)"

          # 2. Fast sub-second packaging for platform-specific compact slices
          if [ "${{ inputs.compile_linux }}" = "true" ]; then
            echo "Generating compact Linux JAR..."
            LINUX_JAR="${OUTPUT_DIR}/CenturyCivilization-${VERSION}-linux.jar"
            cp "$MASTER_JAR" "$LINUX_JAR"
            zip -d "$LINUX_JAR" "assets/century/bin/*.dll" "assets/century/bin/*.dylib" "assets/century/bin/*.h" || true
            echo "SUCCESS: Created compact Linux JAR"
          fi

          if [ "${{ inputs.compile_windows }}" = "true" ]; then
            echo "Generating compact Windows JAR..."
            WIN_JAR="${OUTPUT_DIR}/CenturyCivilization-${VERSION}-windows.jar"
            cp "$MASTER_JAR" "$WIN_JAR"
            zip -d "$WIN_JAR" "assets/century/bin/*.so" "assets/century/bin/*.dylib" || true
            echo "SUCCESS: Created compact Windows JAR"
          fi

          if [ "${{ inputs.compile_mac }}" = "true" ]; then
            echo "Generating compact macOS JAR..."
            MAC_JAR="${OUTPUT_DIR}/CenturyCivilization-${VERSION}-mac.jar"
            cp "$MASTER_JAR" "$MAC_JAR"
            zip -d "$MAC_JAR" "assets/century/bin/*.so" "assets/century/bin/*.dll" "assets/century/bin/*.h" || true
            echo "SUCCESS: Created compact macOS JAR"
          fi

      - name: Upload Build Artifacts
        if: ${{ inputs.mode != 'check' }}
        uses: actions/upload-artifact@v4
        with:
          name: compiled_jars
          path: compiled_jars/*.jar
          retention-days: 7

      - name: Create or Update GitHub Release
        if: ${{ inputs.mode == 'publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" -y || true
          fi

          echo "Publishing new GitHub Release $TAG..."
          gh release create "$TAG" compiled_jars/*.jar --title "Release $TAG" --notes "Automated GitHub Actions Build" --latest
