name: Cloud Build and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.155)'
        required: true
        default: '1.0.155'
      mode:
        description: 'Build Mode (publish, deploy, check)'
        required: true
        default: 'publish'
      compile_linux:
        description: 'Compile Linux JAR'
        type: boolean
        default: true
      compile_windows:
        description: 'Compile Windows JAR'
        type: boolean
        default: true
      compile_mac:
        description: 'Compile macOS JAR'
        type: boolean
        default: true
      build_go_linux:
        description: 'Rebuild Linux Go native bridge'
        type: boolean
        default: false
      build_go_windows:
        description: 'Rebuild Windows Go native bridge'
        type: boolean
        default: false
      build_go_mac:
        description: 'Rebuild macOS Go native bridge'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  cloud-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Cross-Compilers for Go (MinGW)
        if: ${{ inputs.build_go_windows == true || inputs.build_go_windows == 'true' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Native Go Bridges
        run: |
          BIN_DIR="src/main/resources/assets/century/bin"
          mkdir -p "$BIN_DIR"

          if [ "${{ inputs.build_go_linux }}" = "true" ]; then
            echo "Compiling Linux Go Bridge..."
            cd native_bridge_source
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o libbridge-linux-amd64.so main.go
            cp libbridge-linux-amd64.so ../"$BIN_DIR"/
            cd ..
          fi

          if [ "${{ inputs.build_go_windows }}" = "true" ]; then
            echo "Compiling Windows Go Bridge..."
            cd native_bridge_source
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -buildmode=c-shared -o bridge-windows-amd64.dll main.go
            cp bridge-windows-amd64.dll ../"$BIN_DIR"/
            cp bridge-windows-amd64.h ../"$BIN_DIR"/
            cd ..
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Mode Check - CompileJava Syntax Verification
        if: ${{ inputs.mode == 'check' }}
        run: |
          ./gradlew compileJava

      - name: Multiplatform Compilation
        if: ${{ inputs.mode != 'check' }}
        run: |
          VERSION="${{ inputs.version }}"
          OUTPUT_DIR="compiled_jars"
          BIN_DIR="src/main/resources/assets/century/bin"
          BACKUP_DIR="temp_native_backup"

          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$BACKUP_DIR"
          cp -r "$BIN_DIR"/* "$BACKUP_DIR"/ || true

          build_platform_jar() {
            local platform=$1
            local binary_name=$2
            local header_name=$3

            echo "Building JAR for: $platform ($VERSION)..."
            rm -rf "$BIN_DIR"
            mkdir -p "$BIN_DIR"

            if [ -f "$BACKUP_DIR/$binary_name" ]; then
              cp "$BACKUP_DIR/$binary_name" "$BIN_DIR/"
              if [ -n "$header_name" ] && [ -f "$BACKUP_DIR/$header_name" ]; then
                cp "$BACKUP_DIR/$header_name" "$BIN_DIR/"
              fi
            fi

            ./gradlew clean build -Pmod_version="${VERSION}"
            local built_jar="build/libs/CenturyCivilization-${VERSION}.jar"
            if [ -f "$built_jar" ]; then
              mv "$built_jar" "${OUTPUT_DIR}/CenturyCivilization-${VERSION}-${platform}.jar"
              echo "SUCCESS: Created ${OUTPUT_DIR}/CenturyCivilization-${VERSION}-${platform}.jar"
            else
              echo "ERROR: Missing JAR output"
              exit 1
            fi
          }

          if [ "${{ inputs.compile_linux }}" = "true" ]; then
            build_platform_jar "linux" "libbridge-linux-amd64.so" ""
          fi

          if [ "${{ inputs.compile_windows }}" = "true" ]; then
            build_platform_jar "windows" "bridge-windows-amd64.dll" "bridge-windows-amd64.h"
          fi

          if [ "${{ inputs.compile_mac }}" = "true" ]; then
            build_platform_jar "mac" "libbridge-darwin-amd64.dylib" ""
          fi

          # Restore native binaries
          rm -rf "$BIN_DIR"
          mkdir -p "$BIN_DIR"
          cp -r "$BACKUP_DIR"/* "$BIN_DIR"/ || true
          rm -rf "$BACKUP_DIR"

      - name: Upload Build Artifacts
        if: ${{ inputs.mode != 'check' }}
        uses: actions/upload-artifact@v4
        with:
          name: compiled_jars
          path: compiled_jars/*.jar
          retention-days: 7

      - name: Create or Update GitHub Release
        if: ${{ inputs.mode == 'publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" -y || true
          fi

          echo "Publishing new GitHub Release $TAG..."
          gh release create "$TAG" compiled_jars/*.jar --title "Release $TAG" --notes "Automated GitHub Actions Build" --latest
